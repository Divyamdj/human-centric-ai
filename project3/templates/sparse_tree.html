{% extends 'base.html' %}

{% block content %}

<div class="max-w-xl mx-auto mt-10 space-y-6">
  <form method="get" id="lambdaForm">
    <label for="lambda" class="block text-sm font-medium text-gray-700">Lambda (λ):</label>

    <input 
      type="range" 
      name="lambda" 
      id="lambda" 
      min="0" max="1.0" step="0.05" 
      value="{{ lambda_value }}" 
      class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
    >

    <p class="text-sm text-gray-600">
      λ = <span id="lambdaValue">{{ lambda_value }}</span>
    </p>

    <button 
      type="submit" 
      id="submitBtn"
      class="mt-3 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition"
    >
      Apply λ
    </button>

    <p id="loadingText" class="mt-3 text-gray-700 font-semibold" style="display:none;">
      Loading, please wait...
    </p>
  </form>


  {% if error_message %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
      <span class="block sm:inline">{{ error_message }}</span>
    </div>
  {% endif %}

  <div class="bg-white p-4 rounded-xl shadow-md">
    <p class="font-semibold text-green-600">Accuracy: {{ accuracy|floatformat:2 }}</p>
  </div>

  <div class="bg-white p-4 rounded-xl shadow-md">
    <h2 class="text-lg font-semibold">Surrogate Decision Rules</h2>
    <pre class="text-xs whitespace-pre-wrap">{{ rules }}</pre>
  </div>
</div>

<script>
  const slider = document.getElementById('lambda');
  const output = document.getElementById('lambdaValue');
  const form = document.getElementById('lambdaForm');
  const submitBtn = document.getElementById('submitBtn');
  const loadingText = document.getElementById('loadingText');

  slider.addEventListener('input', function() {
    output.textContent = this.value;
  });

  form.addEventListener('submit', function() {
    submitBtn.disabled = true;       // disable button to prevent multiple submits
    loadingText.style.display = 'block'; // show loading message
  });
</script>

{% endblock %}
