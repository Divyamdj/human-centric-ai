{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<style>[x-cloak] { display: none; }</style>
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 bg-white shadow-md rounded-lg p-6" 
     x-data="{ modelType: 'linear', useGridSearch: false, testSize: 0.2 }">

    <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
        Train Regression Model
    </h2>

    <form hx-post="{% url 'project1:regression' %}" 
          hx-target="#results-container" 
          class="space-y-5">
        {% csrf_token %}

        <div>
            <label for="model_type" class="block text-gray-700 font-medium mb-1">
                Model Type
            </label>
            <select name="model_type" id="model_type" required
                    x-model="modelType"
                    class="w-full border border-gray-300 rounded-md px-4 py-2">
                <option value="linear">LinearRegression</option>
                <option value="ridge">Ridge</option>
                <option value="decision_tree">DecisionTreeRegressor</option>
            </select>
        </div>

        <div x-show="modelType === 'ridge'" x-transition>
            <label for="alpha" class=" text-gray-700 font-medium mb-1 flex items-center gap-2">
                Alpha (for Ridge)
                <div x-data="{ open: false }" class="relative">
                    <button type="button" @mouseenter="open = true" @mouseleave="open = false"
                            class="text-blue-500 hover:text-blue-700 text-sm">ℹ️</button>
                    <div x-show="open" x-cloak x-transition
                         class="absolute left-6 top-0 bg-gray-800 text-white text-xs rounded px-2 py-1 shadow">
                        Regularization strength (e.g., 0.01 to 100). Higher values mean more regularization.
                    </div>
                </div>
            </label>
            <input type="number" step="0.01" name="alpha" id="alpha" placeholder="e.g., 1.0"
                   :disabled="useGridSearch"
                   class="w-full border border-gray-300 rounded-md px-4 py-2
                          disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed">
        </div>

        <div x-show="modelType === 'decision_tree'" x-transition>
            <label for="max_depth" class=" text-gray-700 font-medium mb-1 flex items-center gap-2">
                Max Depth (for Decision Tree)
                <div x-data="{ open: false }" class="relative">
                    <button type="button" @mouseenter="open = true" @mouseleave="open = false"
                            class="text-blue-500 hover:text-blue-700 text-sm">ℹ️</button>
                    <div x-show="open" x-cloak x-transition
                         class="absolute left-6 top-0 bg-gray-800 text-white text-xs rounded px-2 py-1 shadow">
                        Depth of the tree. Suggested range: 1 to 50. Leave blank for no limit.
                    </div>
                </div>
            </label>
            <input type="number" name="max_depth" id="max_depth" placeholder="e.g., 5"
                   :disabled="useGridSearch"
                   class="w-full border border-gray-300 rounded-md px-4 py-2
                          disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed">
        </div>

        <div>
            <label for="test_size" class="block text-gray-700 font-medium mb-1 flex items-center gap-2">
                Test Size: <span class="text-indigo-600 font-semibold" x-text="(testSize * 100).toFixed(0) + '%'"></span>
                <div x-data="{ open: false }" class="relative">
                    <button type="button" @mouseenter="open = true" @mouseleave="open = false"
                            class="text-blue-500 hover:text-blue-700 text-sm">ℹ️</button>
                    <div x-show="open" x-cloak x-transition
                         class="absolute left-6 top-0 bg-gray-800 text-white text-xs rounded px-2 py-1 shadow">
                        Proportion of data for testing. Recommended: 10% to 50%.
                    </div>
                </div>
            </label>
            <input type="range"
                   name="test_size"
                   id="test_size"
                   x-model="testSize"
                   min="0.05"
                   max="1.0"
                   step="0.05"
                   class="w-full mt-2 accent-indigo-600">
            <input type="hidden" name="test_size" :value="testSize">
        </div>

        <div class="mt-4">
            <label for="graph_type" class="block text-gray-700 font-medium mb-1">
                Select Graph
            </label>
            <select name="graph_type" id="graph_type" class="w-full border border-gray-300 rounded-md px-4 py-2">
                <option value="scatter" {% if request.POST.graph_type == "scatter" %}selected{% endif %}>Scatter: Actual vs Predicted</option>
                <option value="residuals" {% if request.POST.graph_type == "residuals" %}selected{% endif %}>Residuals Plot</option>
                <option value="hist_residuals" {% if request.POST.graph_type == "hist_residuals" %}selected{% endif %}>Histogram of Residuals</option>
            </select>
        </div>

        <div class="mt-4">
            <label for="metric_type" class="block text-gray-700 font-medium mb-1">Select Metric:</label>
            <select name="metric_type" id="metric_type" class="w-full border border-gray-300 rounded-md px-4 py-2">
                <option value="mse" {% if request.POST.metric_type == "mse" %}selected{% endif %}>Mean Squared Error (MSE)</option>
                <option value="r2" {% if request.POST.metric_type == "r2" %}selected{% endif %}>R² Score</option>
            </select>
        </div>

        <div>
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded">
                Train Model
            </button>
        </div>
    </form>
</div>

<div id="results-container" class="w-1/2 mx-auto mt-6 space-y-4"></div>

{% endblock %}
